<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Distant flat-topped canyon strata, pale">
  <!-- Flat horizontal bands tile seamlessly (repeat-x). Transparent sky above y=340. -->
  <g id="strata-far" class="strata-far">
    <path id="band-cream" class="band-cream" d="M0 340 L900 340 L900 600 L0 600 Z" fill="#f4e6d2"/>
    <path id="band-sand" class="band-sand" d="M0 424 L900 424 L900 600 L0 600 Z" fill="#ecdbbd"/>
    <path id="band-ochre" class="band-ochre" d="M0 500 L900 500 L900 600 L0 600 Z" fill="#e3c5a3"/>
    <path id="band-terra" class="band-terra" d="M0 562 L900 562 L900 600 L0 600 Z" fill="#cf9259" opacity="0.7"/>
    <g id="striations" class="striations" fill="none" stroke="#8f3d2c" stroke-width="2" stroke-linecap="round" opacity="0.25">
      <path d="M0 356 L900 356"/>
      <path d="M0 440 L900 440"/>
      <path d="M0 516 L900 516"/>
      <path d="M0 578 L900 578"/>
    </g>
  </g>
</svg>
