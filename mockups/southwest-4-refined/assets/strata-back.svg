<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420">
  <g id="strata-back" class="strata-back">
    <!-- distant sandstone wall — cream, ochre, and sage bands -->
    <path id="band-cream" class="band-cream" d="M0 420 L0 255 Q 150 225 300 255 T 600 250 T 900 240 T 1200 255 L1200 420 Z" fill="#f4e6d2"/>
    <path id="band-ochre" class="band-ochre" d="M0 420 L0 305 Q 180 275 360 305 T 720 300 T 1080 290 T 1200 305 L1200 420 Z" fill="#e3c5a3"/>
    <path id="band-rust" class="band-rust" d="M0 420 L0 345 Q 220 320 440 345 T 880 340 T 1200 330 L1200 420 Z" fill="#cf9259"/>
    <path id="band-sage" class="band-sage" d="M0 420 L0 375 Q 240 360 480 375 T 960 370 T 1200 380 L1200 420 Z" fill="#8a9179"/>

    <!-- horizontal strata lines that follow the bands -->
    <g id="striations" class="striations" fill="none" stroke="#8f3d2c" stroke-width="1.5" stroke-linecap="round" opacity="0.32">
      <path d="M0 275 Q 200 265 400 275 T 800 270 T 1200 275"/>
      <path d="M0 320 Q 250 310 500 320 T 1000 315 T 1200 320"/>
      <path d="M0 355 Q 300 345 600 355 T 1200 350"/>
      <path d="M0 388 Q 400 380 800 388 T 1200 385"/>
    </g>

    <!-- erosion notches -->
    <g id="notches" class="notches" fill="#f4e6d2" opacity="0.9">
      <ellipse cx="220" cy="255" rx="40" ry="10"/>
      <ellipse cx="620" cy="250" rx="55" ry="12"/>
      <ellipse cx="980" cy="240" rx="45" ry="11"/>
    </g>
  </g>
</svg>